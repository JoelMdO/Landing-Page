<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Lexend:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <header>
      <button class="login-button" type="button">Login</button>
    </header>
    <main class="main-content">
      <h1>Viajar es la mejor forma de invertir.</h1>
      <div class="image-container">
        <img class="hero-image" src="assets/hero.png" alt="Hero Image" />
        <div class="image-right__text">
          <p>
            Descubre nuevos destinos, culturas y experiencias que enriquecerán
            tu vida y te brindarán recuerdos inolvidables.
          </p>
          <button class="start-button" type="button">Iniciar</button>
        </div>
      </div>
    </main>
  </body>
</html>
