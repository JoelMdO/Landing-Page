      property="og:title"
      content="Viajar — Invierte en experiencias inolvidables"

      content="Viaja a destinos increíbles y acumula experiencias. Encuentra ofertas, guías y consejos para planear tu próximo viaje."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Viajar — Invierte en experiencias inolvidables"
    />
    <meta
      name="twitter:description"
      content="Viaja a destinos increíbles y acumula experiencias. Encuentra ofertas, guías y consejos para planear tu próximo viaje."

    <header role="banner">
      <nav aria-label="Main navigation">
        <button class="login-button" type="button" aria-label="Iniciar sesión">
          Login
        </button>
      </nav>
    </header>
    <main class="main-content">
      <h1 id="site-title">Viajar es la mejor forma de invertir.</h1>
      <div class="image-container">
        <img
          class="hero-image"
          src="assets/hero.png"
          alt="Panorámica de un destino de viaje"
        />
        <div class="image-right__text">
          <h2>Descubre nuevos destinos, culturas y experiencias.</h2>
          <p>
            Enriquece tu vida con recuerdos inolvidables y recomendaciones de
            viaje.
          </p>
          <button
            class="start-button"
            type="button"
            aria-label="Iniciar exploración"
          >
            Iniciar
          </button>
        </div>
      </div>
    </main>
